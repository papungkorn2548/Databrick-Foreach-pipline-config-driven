bundle:
  name: CF_DRIVEN_DATABIRCK

include:
  - resources/*.yml

variables:
  catalog:
  root_path:
    default: /Workspace/Users/~/.bundle/${bundle.name}/${bundle.target}
  notebook_base_path:
    description: "Absolute workspace path to the project root (where src/ is located)"
    default: /Workspace/Users/~/Databrick-Foreach-pipline-config-driven
  package_dependencies:
    description: "Python dependencies for job environments"
    default: []

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-5ff5343c-d92d.cloud.databricks.com
      root_path: ${var.root_path}
    variables:
      catalog: dev

  prod:
    mode: production
    workspace:
      host: https://dbc-5ff5343c-d92d.cloud.databricks.com
      root_path: ${var.root_path}
    artifacts:
      default:
        type: whl
        build: python3 -m build
        path: ./logic_packages/
    variables:
      catalog: prod

      package_dependencies:
        - ./logic_packages/dist/*.whl